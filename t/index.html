<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d9488">
  <title>Walkie</title>
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <style>
    :root { --brand: #0d9488; --brand-700: #115e59; --bg: #f0fdfa; --surface: #fff; --text: #0b1324; --muted: #5b677c;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", "Noto Sans Ethiopic", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e141b; --surface: #17202b; --text: #e8edf3; --muted: #93a1b5; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { display: flex; align-items: center; justify-content: center; padding: 24px 16px; min-height: 100vh; }
    main { width: 100%; max-width: 380px; background: var(--surface); border-radius: 24px; padding: 28px 22px; text-align: center;
      box-shadow: 0 10px 40px rgba(11,19,36,.12); }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; line-height: 1.35; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
    .play { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 16px;
      border-radius: 14px; background: var(--brand); color: #fff; font-weight: 800; font-size: 17px; text-decoration: none; }
    .alt { display: inline-block; margin-top: 14px; color: var(--brand-700); font-size: 15px; font-weight: 600; }
    @media (prefers-color-scheme: dark) { .alt { color: #5eead4; } }
    .spin { width: 28px; height: 28px; margin: 18px auto 0; border: 3px solid rgba(13,148,136,.25); border-top-color: var(--brand); border-radius: 50%; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="../icon.svg" alt="Walkie" width="72" height="72">

    <section id="opening">
      <h1 data-k="opening"></h1>
      <div class="spin" aria-hidden="true"></div>
    </section>

    <section id="sorry" hidden>
      <h1 data-k="sorry"></h1>
      <p data-k="after"></p>
      <a class="play" id="play" rel="noopener"><span data-k="play"></span></a>
      <a class="alt" id="open" data-k="haveApp" hidden></a>
    </section>

    <section id="invalid" hidden>
      <h1 data-k="invalid"></h1>
      <a class="play" id="play2" rel="noopener"><span data-k="play"></span></a>
    </section>
  </main>

  <script>
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=com.walkie.app';
      var T = {
        he: { opening: 'פותחים את Walkie…', sorry: 'סליחה, אבל Walkie לא מותקנת אצלך.', after: 'אחרי ההתקנה פתחו שוב את הקישור שקיבלתם כדי לראות את הנסיעה.', play: 'להורדה בחנות Google Play', haveApp: 'Walkie מותקנת אצלך? פתחו אותה', invalid: 'הקישור לא תקין. בקשו מהחבר לשלוח אותו מחדש.' },
        en: { opening: 'Opening Walkie…', sorry: "Sorry, but Walkie isn't installed on your device.", after: 'After installing, open the link you received again to see the trip.', play: 'Get it on Google Play', haveApp: 'Have Walkie? Open it', invalid: 'This link is not valid. Ask your friend to send it again.' },
        ru: { opening: 'Открываем Walkie…', sorry: 'Извините, но Walkie не установлено на вашем устройстве.', after: 'После установки откройте полученную ссылку ещё раз, чтобы увидеть поездку.', play: 'Скачать в Google Play', haveApp: 'Walkie уже установлено? Открыть', invalid: 'Ссылка недействительна. Попросите друга отправить её снова.' },
        am: { opening: 'Walkie በመክፈት ላይ…', sorry: 'ይቅርታ፣ ግን Walkie በእርስዎ መሣሪያ ላይ አልተጫነም።', after: 'ከተጫነ በኋላ ጉዞውን ለማየት የተላከልዎትን ሊንክ እንደገና ይክፈቱ።', play: 'ከGoogle Play ያውርዱ', haveApp: 'Walkie አለዎት? ይክፈቱ', invalid: 'ሊንኩ ትክክል አይደለም። ጓደኛዎ እንደገና እንዲልክ ይጠይቁ።' }
      };
      var l = (navigator.language || 'en').slice(0, 2).toLowerCase();
      if (l === 'iw') l = 'he';
      var lang = T[l] ? l : 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
      [].forEach.call(document.querySelectorAll('[data-k]'), function (el) { el.textContent = T[lang][el.getAttribute('data-k')]; });

      var play = PLAY + '&referrer=' + encodeURIComponent('utm_source=trip_share&utm_medium=live_link');
      document.getElementById('play').href = play;
      document.getElementById('play2').href = play;

      var p = new URLSearchParams(location.search);
      var id = (p.get('id') || '').replace(/[^a-z0-9]/gi, '').slice(0, 40);
      function show(name) {
        ['opening', 'sorry', 'invalid'].forEach(function (s) { document.getElementById(s).hidden = s !== name; });
      }
      if (!id) { show('invalid'); return; }

      var isAndroid = /Android/i.test(navigator.userAgent);
      var fallback = location.origin + location.pathname + '?id=' + id + '&missing=1';
      // Chrome באנדרואיד: פותח את Walkie, ואם היא לא מותקנת עובר לכתובת הגיבוי (missing=1)
      var intent = 'intent://t/' + id + '#Intent;scheme=walkie;package=com.walkie.app;S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
      var open = document.getElementById('open');
      open.href = isAndroid ? intent : 'walkie://t/' + id;

      if (!isAndroid || p.get('missing') === '1') {
        show('sorry');
        open.hidden = !isAndroid;   // באנדרואיד אפשר לנסות לפתוח ידנית (למשל אם הפתיחה האוטומטית נחסמה)
        return;
      }

      show('opening');
      var left = false;
      document.addEventListener('visibilitychange', function () { if (document.hidden) left = true; });
      window.addEventListener('pagehide', function () { left = true; });
      location.href = intent;
      // לא נפתחה אפליקציה אחרי רגע: מציגים שהיא לא מותקנת (עם אפשרות לנסות לפתוח ידנית)
      setTimeout(function () {
        if (left || document.hidden) return;
        show('sorry');
        open.hidden = false;
      }, 2200);
    })();
  </script>
</body>
</html>
