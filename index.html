<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d9488">
  <title>Walkie – ניווט ותחבורה ציבורית</title>
  <meta name="description" content="Walkie: ניווט רגלי ותחבורה ציבורית בזמן אמת, בחינם.">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    :root { --brand: #0d9488; --bg: #f0fdfa; --surface: #fff; --text: #0b1324; --muted: #5b677c; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e141b; --surface: #17202b; --text: #e8edf3; --muted: #93a1b5; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--text); }
    main { max-width: 420px; background: var(--surface); border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 10px 40px rgba(11,19,36,.12); }
    img { width: 84px; height: 84px; border-radius: 20px; }
    h1 { margin: 16px 0 6px; font-size: 26px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 20px; }
    a.play { display: block; padding: 14px 16px; border-radius: 14px; background: var(--brand); color: #fff; font-weight: 800; font-size: 17px; text-decoration: none; }
    small { display: block; margin-top: 18px; color: var(--muted); }
    small a { color: var(--brand); }
  </style>
</head>
<body>
  <main>
    <img src="icon.svg" alt="" width="84" height="84">
    <h1>Walkie</h1>
    <p>ניווט רגלי ותחבורה ציבורית בזמן אמת. אוטובוסים על המפה, ליווי נסיעה, ומחיר ברב-קו. בחינם.</p>
    <a class="play" href="https://play.google.com/store/apps/details?id=com.walkie.app">הורדה מ-Google Play</a>
    <small><a href="https://walkie-4a743.web.app/privacy.html">מדיניות פרטיות</a></small>
  </main>
</body>
</html>
